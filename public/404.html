<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12161C">
  <title>Page not found - Bindary</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, #0B1026 0%, #141328 42%, #241C2A 74%, #2A211C 100%);
      color: #ECE3D0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    main { max-width: 420px; }

    /* a little stack of books with one missing from the shelf */
    .shelf { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
    .book { width: 22px; border-radius: 3px; border: 1.5px solid #D6B45C; }
    .gap {
      width: 22px; height: 78px; border-radius: 3px;
      border: 1.5px dashed rgba(214, 180, 92, 0.45);
    }
    .ledge { width: 180px; height: 6px; margin: 0 auto 32px; border-radius: 3px; background: #4A3626; }

    .code {
      font-family: Fraunces, Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.24em;
      color: #D6B45C;
      margin: 0 0 10px;
    }

    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1.2;
      margin: 0 0 12px;
    }

    p.lede {
      font-family: Fraunces, Georgia, serif;
      font-style: italic;
      font-size: 16px;
      line-height: 1.6;
      color: rgba(236, 227, 208, 0.68);
      margin: 0 0 30px;
    }

    a.home {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, #EFD68F 0%, #D6B45C 100%);
      color: #2A1C10;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(214, 180, 92, 0.25);
    }

    a.home:hover { filter: brightness(1.06); }
    a.home:focus-visible { outline: 2px solid #EFD68F; outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <div class="shelf" aria-hidden="true">
      <div class="book" style="height: 70px; background: #6E2B2B;"></div>
      <div class="book" style="height: 86px; background: #2C4A3B;"></div>
      <div class="gap"></div>
      <div class="book" style="height: 64px; background: #B0863A;"></div>
      <div class="book" style="height: 80px; background: #2B3A5C;"></div>
    </div>
    <div class="ledge" aria-hidden="true"></div>

    <p class="code">404</p>
    <h1>This page was never bound.</h1>
    <p class="lede">The shelf has a gap where it should be. Perhaps it was misplaced, or never written at all.</p>
    <a class="home" href="/">Back to your library</a>
  </main>
</body>

</html>
